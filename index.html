<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCU Hub</title>
  <meta name="description" content="SCU Hub - Our Campus, Together." />
  <style>
    :root {
      --bg: #070606;
      --panel: rgba(18, 14, 14, 0.82);
      --panel-2: rgba(24, 18, 18, 0.92);
      --border: rgba(162, 27, 38, 0.18);
      --border-strong: rgba(162, 27, 38, 0.44);
      --border-soft: rgba(255, 255, 255, 0.06);
      --text: #f3ecec;
      --muted: #b4a7a7;
      --muted-2: #887d7d;
      --accent: #a11b26;
      --accent-soft: rgba(161, 27, 38, 0.12);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(161, 27, 38, 0.16), transparent 28%),
        linear-gradient(180deg, #090808 0%, #060505 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .shell {
      width: min(calc(100% - 32px), var(--max));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .hero {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius-xl) + 2px);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)),
        linear-gradient(135deg, rgba(161, 27, 38, 0.08), transparent 46%);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      align-self: flex-start;
      gap: 20px;
      min-width: 0;
      padding-top: 0;
      margin-top: 2px;
    }

    .crest {
      width: 111px;
      height: 111px;
      flex: 0 0 auto;
      border-radius: 22px;
      position: relative;
      overflow: hidden;
      margin-top: 1px;
      border: 1px solid rgba(180, 63, 73, 0.45);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.04),
        0 0 32px rgba(161, 27, 38, 0.12);
      background: rgba(20, 14, 14, 0.98);
    }

    .crest img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy h1 {
      margin: 0;
      font-family: "Cormorant Garamond", "Times New Roman", Georgia, serif;
      font-size: clamp(2.2rem, 4.8vw, 4.4rem);
      line-height: 0.86;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      font-weight: 500;
      text-shadow: 0 0 20px rgba(161, 27, 38, 0.14);
    }

    .brand-copy p {
      margin: 10px 0 0;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 400;
    }

    .search-panel {
      width: min(100%, 620px);
      margin-left: auto;
      display: grid;
      gap: 12px;
    }

    .search-modes {
      display: inline-flex;
      gap: 8px;
      padding: 6px;
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      background: rgba(255,255,255,0.02);
      width: fit-content;
    }

    .mode-btn {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, box-shadow .2s ease;
    }

    .mode-btn.active {
      color: var(--text);
      background: rgba(161, 27, 38, 0.16);
      box-shadow: inset 0 0 0 1px rgba(161, 27, 38, 0.25);
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .search-wrap input {
      width: 100%;
      padding: 16px 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(13, 11, 11, 0.94);
      color: var(--text);
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .search-wrap input:focus {
      border-color: var(--border-strong);
      box-shadow: 0 0 0 4px rgba(161, 27, 38, 0.15);
    }

    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    main { margin-top: 22px; }

    .section { margin-top: 24px; padding-top: 18px; }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 0.84rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #e8dede;
    }

    .section-head span { color: var(--muted-2); font-size: 0.84rem; }

    .categories-shell {
      display: grid;
      gap: 14px;
    }

    .category-panel {
      border: 1px solid var(--border);
      border-radius: 30px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.018), rgba(255,255,255,0.008)),
        radial-gradient(circle at top left, rgba(161, 27, 38, 0.055), transparent 44%);
      box-shadow: 0 10px 28px rgba(0,0,0,0.16);
      overflow: clip;
      transition: border-color .22s ease, transform .22s ease, box-shadow .22s ease, background .22s ease;
      position: relative;
    }

    .category-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.02);
    }

    .category-panel:hover,
    .category-panel.open {
      border-color: var(--border-strong);
      box-shadow: 0 14px 34px rgba(0,0,0,0.24);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.022), rgba(255,255,255,0.009)),
        radial-gradient(circle at top left, rgba(161, 27, 38, 0.08), transparent 48%);
    }

    .category-toggle {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 16px 18px 14px;
      cursor: pointer;
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 16px;
      align-items: center;
      text-align: left;
      min-height: 104px;
    }

    .category-badge {
      width: 64px;
      height: 64px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(161, 27, 38, 0.18);
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,0.085), transparent 28%),
        linear-gradient(145deg, rgba(18,14,14,0.98), rgba(28,18,18,0.94));
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.025),
        0 0 18px rgba(161, 27, 38, 0.05);
      position: relative;
      overflow: hidden;
      padding: 8px;
    }

    .category-badge::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.07);
    }

    .category-badge::after {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 12px;
      border: 1px solid rgba(161, 27, 38, 0.20);
      transform: rotate(12deg);
    }

    .category-icon {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transform: scale(1.08);
      image-rendering: auto;
    }

    .category-text {
      min-width: 0;
      opacity: 0.95;
    }

    .category-name {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      line-height: 1.08;
      font-weight: 500;
    }

    .category-count {
      margin-top: 4px;
      color: var(--muted-2);
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .category-arrow {
      width: 64px;
      height: 64px;
      object-fit: cover;
      object-position: center;
      opacity: 1;
      transition: transform .2s ease, filter .2s ease;
      filter: contrast(1.02) saturate(1.02);
      border-radius: 18px;
      background: rgba(255,255,255,0.02);
      padding: 8px;
    }

    .category-panel.open .category-arrow {
      transform: rotate(180deg);
    }

    .category-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height .34s ease;
      border-top: 1px solid rgba(255,255,255,0.04);
    }

    .category-panel.open .category-content { max-height: 1400px; }

    .category-panel.open .cards-grid {
      padding-top: 10px;
    }

    .cards-grid {
      padding: 18px 20px 22px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .site-card {
      display: block;
      min-height: 78px;
      padding: 15px 16px 13px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.045);
      background: rgba(255,255,255,0.012);
      transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .site-card:hover {
      transform: translateY(-1px);
      border-color: rgba(161, 27, 38, 0.28);
      background: rgba(161, 27, 38, 0.075);
      box-shadow: 0 10px 26px rgba(0,0,0,0.18);
    }

    .site-name {
      font-size: 0.88rem;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.28;
    }

    .results-section .cards-grid {
      padding: 0;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .results-section .site-card {
      min-height: 72px;
    }

    .empty {
      margin-top: 24px;
      padding: 46px 20px;
      text-align: center;
      border: 1px dashed rgba(255,255,255,0.12);
      border-radius: var(--radius-xl);
      color: var(--muted);
      background: rgba(255,255,255,0.012);
    }

    .hidden { display: none !important; }

    .cards-grid.compact-grid {
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    @media (max-width: 1120px) {
      .categories-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .category-toggle { grid-template-columns: 72px 1fr auto; }
    }

    @media (max-width: 720px) {
      .shell { width: min(calc(100% - 20px), var(--max)); padding-top: 10px; }
      .hero { padding: 18px; }
      .brand-row { align-items: stretch; }
      .search-panel { margin-left: 0; width: 100%; }
      .search-modes { width: 100%; justify-content: space-between; }
      .mode-btn { flex: 1; }
      .categories-grid { grid-template-columns: 1fr; }
      .section-head { flex-direction: column; align-items: start; }
      .category-toggle { grid-template-columns: 64px 1fr auto; }
      .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 480px) {
      .brand-lockup { width: 100%; }
      .crest { width: 60px; height: 60px; border-radius: 18px; }
      .brand-copy h1 { font-size: clamp(2rem, 12vw, 3rem); }
      .cards-grid { grid-template-columns: 1fr; }
      .category-toggle { grid-template-columns: 1fr auto; justify-items: start; }
      .category-badge { width: 62px; height: 62px; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div class="brand-row">
        <div class="brand-lockup">
          <div class="crest" aria-hidden="true">
            <img src="logo1.jpeg" alt="" />
          </div>
          <div class="brand-copy">
            <h1>SCU Hub</h1>
            <p>Our Campus, Together.</p>
          </div>
        </div>

        <div class="search-panel">
          <div class="search-modes" role="tablist" aria-label="Search mode">
            <button id="localModeBtn" class="mode-btn active" type="button" data-mode="local" role="tab" aria-selected="true">Campus Search</button>
            <button id="googleModeBtn" class="mode-btn" type="button" data-mode="google" role="tab" aria-selected="false">Google Search</button>
          </div>
          <div class="search-wrap" aria-label="Search sites">
            <input id="searchInput" type="search" placeholder="Search by name, category, or URL" autocomplete="off" />
          </div>
        </div>
      </div>
      <div class="hint" id="hintText">A minimal campus navigation for Sichuan University students.</div>
    </header>

    <main>
      <section id="categoriesSection" class="section">
        <div class="section-head">
          <h2>Categories</h2>
          <span>Click or hover to expand</span>
        </div>
        <div id="categoriesGrid" class="categories-shell"></div>
      </section>

      <section id="resultsSection" class="section results-section hidden">
        <div class="section-head">
          <h2>Search Results</h2>
          <span id="resultsCount"></span>
        </div>
        <div id="resultsGrid" class="cards-grid"></div>
        <div id="emptyState" class="empty hidden">No results found.</div>
      </section>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    const { categories, sites } = window.SCU_HUB_DATA;
    const searchInput = document.getElementById('searchInput');
    const localModeBtn = document.getElementById('localModeBtn');
    const googleModeBtn = document.getElementById('googleModeBtn');
    const hintText = document.getElementById('hintText');
    const categoriesSection = document.getElementById('categoriesSection');
    const resultsSection = document.getElementById('resultsSection');
    const categoriesGrid = document.getElementById('categoriesGrid');
    const resultsGrid = document.getElementById('resultsGrid');
    const emptyState = document.getElementById('emptyState');
    const resultsCount = document.getElementById('resultsCount');

    let searchMode = 'local';

    const categoryIcons = {
      'Study': '04.png',
      'Research': '05.png',
      'Online Courses': '06.png',
      'Campus Life': '01.png',
      'Engineering': '02.png',
      'Productivity': '03.png'
    };

    const escapeHtml = (value) => String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');

    const fuzzyMatch = (text, query) => {
      const target = text.toLowerCase();
      const q = query.toLowerCase().trim();
      if (!q) return true;
      let i = 0;
      for (const char of target) {
        if (char === q[i]) i += 1;
        if (i === q.length) return true;
      }
      return target.includes(q);
    };

    const createSiteCard = (site) => {
      const card = document.createElement('a');
      card.className = 'site-card';
      card.href = site.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.title = site.url;
      card.innerHTML = `<div class="site-name">${escapeHtml(site.name)}</div>`;
      return card;
    };

    const searchSites = (query) => sites.filter(site => {
      const haystack = `${site.name} ${site.category} ${site.url}`;
      return fuzzyMatch(haystack, query);
    });

    const setSearchMode = (mode) => {
      searchMode = mode;
      const isLocal = mode === 'local';

      localModeBtn.classList.toggle('active', isLocal);
      googleModeBtn.classList.toggle('active', !isLocal);
      localModeBtn.setAttribute('aria-selected', String(isLocal));
      googleModeBtn.setAttribute('aria-selected', String(!isLocal));

      searchInput.placeholder = isLocal
        ? 'Search by name, category, or URL'
        : 'Search Google for anything';

      hintText.textContent = isLocal
        ? '海纳百川，有容乃大'
        : '愿学术自由之风劲吹';

      updateView();
    };

    const renderCategories = () => {
      categoriesGrid.innerHTML = '';

      categories.forEach(category => {
        const panel = document.createElement('article');
        panel.className = 'category-panel';
        panel.dataset.category = category;

        const items = sites.filter(site => site.category === category);

        panel.innerHTML = `
          <button class="category-toggle" type="button" aria-expanded="false" aria-label="${escapeHtml(category)} category">
            <div class="category-badge" aria-hidden="true">
              <img class="category-icon" src="${escapeHtml(categoryIcons[category] || '')}" alt="" />
            </div>
            <div class="category-text">
              <div class="category-name">${escapeHtml(category)}</div>
              <div class="category-count">${items.length} sites</div>
            </div>
            <img class="category-arrow" src="small logo.png" alt="" aria-hidden="true" />
          </button>
          <div class="category-content" hidden>
            <div class="cards-grid"></div>
          </div>
        `;

        const toggle = panel.querySelector('.category-toggle');
        const content = panel.querySelector('.category-content');
        const grid = panel.querySelector('.cards-grid');

        items.forEach(site => grid.appendChild(createSiteCard(site)));

        const setOpen = (open) => {
          panel.classList.toggle('open', open);
          toggle.setAttribute('aria-expanded', String(open));
          content.hidden = !open;
        };

        toggle.addEventListener('click', () => setOpen(!panel.classList.contains('open')));
        panel.addEventListener('mouseenter', () => setOpen(true));
        panel.addEventListener('mouseleave', () => setOpen(false));

        categoriesGrid.appendChild(panel);
      });
    };

    const renderSearchResults = (query) => {
      const results = searchSites(query);
      resultsGrid.innerHTML = '';
      resultsCount.textContent = `${results.length} result${results.length === 1 ? '' : 's'}`;
      emptyState.classList.toggle('hidden', results.length !== 0);
      results.forEach(site => resultsGrid.appendChild(createSiteCard(site)));
    };

    const updateView = () => {
      const query = searchInput.value.trim();
      const searching = query.length > 0;

      categoriesSection.classList.toggle('hidden', searching);
      resultsSection.classList.toggle('hidden', !searching);

      if (searching) {
        if (searchMode === 'local') {
          renderSearchResults(query);
        } else {
          resultsGrid.innerHTML = '';
          emptyState.classList.add('hidden');
          resultsCount.textContent = 'Google search';
        }
      }
    };

    searchInput.addEventListener('input', updateView);
    searchInput.addEventListener('keydown', (event) => {
      if (searchMode === 'google' && event.key === 'Enter') {
        const query = searchInput.value.trim();
        if (!query) return;
        window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank', 'noopener,noreferrer');
      }
    });

    localModeBtn.addEventListener('click', () => setSearchMode('local'));
    googleModeBtn.addEventListener('click', () => setSearchMode('google'));

    renderCategories();
    setSearchMode('local');
    updateView();
  </script>
</body>
</html>
